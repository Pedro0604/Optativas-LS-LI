<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo Práctico: Servidor Web asincrónico con ESP32 - Spadari Pedro</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Trabajo Práctico: Servidor Web asincrónico con ESP32</h1>
    </header>

    <main>
        <div class="contenedor-reloj">
            <p>Última actualización: <span id="texto-reloj">--:--:--</span></p>
        </div>
        <section class="tarjeta" id="seccion-led">
            <h3>LED integrado</h3>
            <div class="visualizador-led">
                <div id="indicador-led" class="led apagado"></div>
            </div>
            <p id="texto-estado-led" class="texto-destacado">Estado: Consultando...</p>
            <button id="boton-led" disabled>Cargando...</button>
        </section>

        <section class="tarjeta" id="seccion-sensores">
            <h3>Datos del sensor DHT11</h3>
            <div class="contenedor-sensores">
                <div class="sensor">
                    <h4>Temperatura</h4>
                    <div class="termometro">
                        <div id="relleno-termometro" class="relleno"></div>
                    </div>
                    <p id="texto-temperatura" class="texto-destacado">-- °C</p>
                </div>
                <div class="sensor">
                    <h4>Humedad</h4>
                    <div class="higrometro">
                        <div id="relleno-higrometro" class="relleno"></div>
                    </div>
                    <p id="texto-humedad" class="texto-destacado">-- %</p>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>Hecho por Pedro Spadari</p>
        <p class="institucion">Facultad de Informática UNLP - Cátedra IoT</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
