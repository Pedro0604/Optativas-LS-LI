services:
  mosquitto:
    image: eclipse-mosquitto:latest
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/log:/mosquitto/log
      - mosquitto_data:/mosquitto/data
    ports:
      - "1883:1883"
    environment:
      - TZ=America/Argentina/Buenos_Aires

  nodered:
    image: nodered/node-red:latest
    ports:
      - "1880:1880"
    volumes:
      - ./nodered_data:/data
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - INFLUXDB_TOKEN=IEjS8estr9A_nxkAyY8GlaBS0H720adFNMEhxTtCuOSdyFPPPklnnJiOWQWkV_FlFZ96bpYmdmA9doGJ_iE04g==

  influxdb:
    image: influxdb:2.9.1
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin1234
      - DOCKER_INFLUXDB_INIT_ORG=unlp
      - DOCKER_INFLUXDB_INIT_BUCKET=iot
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=TokenSuperSecretoTPIoTSpadariPedro
  
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin1234
      - INFLUXDB_TOKEN=TokenSuperSecretoTPIoTSpadariPedro
    
volumes:
  mosquitto_data:
  nodered_data:
  influxdb_data:
  grafana_data: